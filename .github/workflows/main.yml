
name: Build OneOS Full APK

run-name: OneOS Full APK — ${{ github.ref_name }}

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oneos-full-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-full-apk:
    name: Build and verify OneOS (full edition)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      GH_PACKAGES_USER: ${{ secrets.GH_PACKAGES_USER }}
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Verify GitHub Packages credentials
        run: |
          set -Eeuo pipefail

          if [[ -z "${GH_PACKAGES_USER}" || -z "${GH_PACKAGES_TOKEN}" ]]; then
            echo "::error::GitHub Packages credentials are missing."
            echo "Add GH_PACKAGES_USER and GH_PACKAGES_TOKEN under repository Actions secrets."
            exit 1
          fi

          echo "GitHub Packages credentials are configured."

      - name: Set up JDK 24
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '24'


      - name: Configure Gradle cache and validate wrapper
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v4

      - name: Install Android API 37 SDK and build tools
        run: |
          set -Eeuo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/.android/sdk}}"
          echo "Using Android SDK at: ${SDK_ROOT}"
          echo "ANDROID_HOME=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"

          command -v sdkmanager >/dev/null 2>&1 || {
            echo 'sdkmanager is not on PATH after setup-android.' >&2
            exit 1
          }

          installed=false
          for attempt in 1 2 3; do
            if sdkmanager --install --channel=0 \
              'platforms;android-37.0' \
              'build-tools;36.0.0' \
              'build-tools;37.0.0' \
              'platform-tools'; then
              installed=true
              break
            fi

            if [[ "$attempt" -lt 3 ]]; then
              echo "SDK installation attempt ${attempt} failed; retrying..." >&2
              sleep "$((attempt * 15))"
            fi
          done

          if [[ "$installed" != true ]]; then
            echo 'Android SDK installation failed after three attempts.' >&2
            sdkmanager --list --channel=0 || true
            exit 1
          fi

          PLATFORM_DIR="${SDK_ROOT}/platforms/android-37"
          PLATFORM_37_0="${SDK_ROOT}/platforms/android-37.0"

          if [[ ! -f "${PLATFORM_DIR}/android.jar" ]]; then
            if [[ -e "${PLATFORM_DIR}" || -L "${PLATFORM_DIR}" ]]; then
              rm -rf "${PLATFORM_DIR}"
            fi

            [[ -f "${PLATFORM_37_0}/android.jar" ]] || {
              echo "Expected API 37 platform was not installed." >&2
              exit 1
            }

            ln -s 'android-37.0' "${PLATFORM_DIR}"
          fi

          [[ -s "${PLATFORM_DIR}/android.jar" ]] || {
            echo 'Android API 37 android.jar is missing.' >&2
            exit 1
          }

          [[ -x "${SDK_ROOT}/build-tools/36.0.0/aapt2" ]] || {
            echo 'Android build-tools 36.0.0/aapt2 is missing.' >&2
            exit 1
          }

          [[ -x "${SDK_ROOT}/build-tools/37.0.0/apksigner" ]] || {
            echo 'Android build-tools 37.0.0/apksigner is missing.' >&2
            exit 1
          }

          echo 'Installed Android packages:'
          sdkmanager --list_installed | grep -E 'platforms;android-37|build-tools;36.0.0|build-tools;37.0.0|platform-tools' || true
          ls -ld "${SDK_ROOT}/platforms/android-37" "${SDK_ROOT}/platforms/android-37.0"

      - name: Verify repository build inputs
        run: |
          set -Eeuo pipefail

          chmod +x app-android/gradlew

          test -s app-android/gradle/wrapper/gradle-wrapper.jar
          test -s app-android/gradle/wrapper/gradle-wrapper.properties
          test -s app-android/packages/remote.txt
          test -s app-android/packages/sizes.txt
          test -s app-android/packages/series.txt
          test -s app-android/packages/patch-sources.json
          test -s scripts/check-staging-apk.py
          test -s scripts/build-guest-manager.sh
          test -s switcher/assets/oneos_switch.sh
          test -s switcher/assets/guest_runtime.sh
          test -s switcher/assets/OneOSBootStatus.dex
          test -s switcher/assets/OneOSEdmStub.dex
          test -s switcher/assets/oneos_btaudio
          test -s switcher/assets/OneOSOverlayDimen.dex

          python3 --version
          java -version

      - name: Build and stage the required guest manager APK
        run: |
          set -Eeuo pipefail

          sh scripts/build-guest-manager.sh --debug

          test -s switcher/assets/guest_manager.apk

          echo 'Generated guest manager APK:'
          ls -lh switcher/assets/guest_manager.apk

      - name: Run unit tests, full-app lint, and build OneOS only
        working-directory: app-android
        run: |
          set -Eeuo pipefail

          ./gradlew \
            --no-daemon \
            --console=plain \
            --stacktrace \
            --max-workers=2 \
            test \
            lintFullDebug \
            :app:assembleFullDebug

      - name: Verify the final APK and prepare artifact
        run: |
          set -Eeuo pipefail

          APK='app-android/app/build/outputs/apk/full/debug/app-full-debug.apk'

          [[ -s "${APK}" ]] || {
            echo "Full OneOS APK was not produced: ${APK}" >&2
            find app-android/app/build/outputs -maxdepth 6 -type f -print 2>/dev/null || true
            exit 1
          }

          python3 scripts/check-staging-apk.py "${APK}"

          "${ANDROID_HOME}/build-tools/37.0.0/apksigner" verify --verbose "${APK}"

          mkdir -p dist
          cp "${APK}" dist/OneOS-full-debug.apk

          echo 'APK details:'
          ls -lh dist/OneOS-full-debug.apk
          sha256sum dist/OneOS-full-debug.apk

          {
            echo '## OneOS Full APK build'
            echo
            echo "- Source commit: \`${GITHUB_SHA}\`"
            echo '- Edition: `full` (not Probe)'
            echo '- Variant: `debug`'
            echo '- Overlay payloads: not packed'
            echo '- Unit tests: passed'
            echo '- Full debug lint: passed'
            echo '- Staging integrity check: passed'
            echo
            echo '### APK SHA-256'
            echo '```text'
            sha256sum dist/OneOS-full-debug.apk
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload OneOS full APK
        uses: actions/upload-artifact@v7
        with:
          name: OneOS-full-debug-${{ github.sha }}
          path: dist/OneOS-full-debug.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          archive: false

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: OneOS-build-reports-${{ github.run_id }}
          path: |
            app-android/**/build/reports/**
            app-android/**/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7
